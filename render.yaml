# Render Blueprint for the GOLDEN ARROW frontend (static site). This file is on the branch
# `production/golden-arrow` and describes that client's own site. Deploy it from THIS BRANCH.
#
# The Vite app is at the repository root, so the build writes ./dist there and rootDir stays empty.
# Keep staticPublishPath and rootDir consistent: Render reported "Publish directory dist does not
# exist" when the build ran in one directory and the publish step looked in another.
#
# Render does not read public/_redirects (that file is Netlify's); the SPA fallback has to be the
# rewrite route below, or deep links such as /dashboard 404 on refresh even though index.html is
# published.
#
# The backend is proxied through this site, so the backend's own host is in no request a browser can
# see. THE /api/* REWRITE MUST SIT ABOVE THE SPA FALLBACK - below it, /* answers every API call with
# index.html and the app dies on a JSON parse error at the first request. Its destination is THIS
# CLIENT'S OWN backend; pointed at another client's service it would sign people in against the wrong
# database. The backend must ship SESSION_COOKIE_SAMESITE=lax in the same deploy, since app and API
# are one origin now. (A dashboard-made service ignores this file - see the backend's render.yaml -
# so this is also the record to apply by hand in the dashboard.)
services:
  - type: web
    runtime: static
    name: goldenarrow
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # The ONLY build-time variable the code reads (src/axios/axios.js; the developer console builds
      # on the same API_BASE_URL). Relative on purpose: resolveApiBaseUrl's "host only" branch exists
      # for the older bare-host value this used to be, and a relative path keeps the backend's address
      # out of the bundle entirely. .env.production carries the same value, so a build with no
      # dashboard variables still behaves like the deployed site.
      - key: VITE_API_URL
        value: /api/v1
    routes:
      # The backend service is named `api-golden-arrow-385b` - Render appends a suffix when the name
      # is already taken on the account, so READ IT OFF THE DASHBOARD rather than assuming the tidy
      # name. Get it wrong and the SPA still loads, so the app looks fine until its first request;
      # the developer console cannot sign in either. The two wrong-destination symptoms differ, and
      # both were MEASURED on this client (11 Nov 2026):
      #   - a name that was never a service     -> 404 with `x-render-routing: no-server`
      #   - a name whose service has been DELETED -> HTTP 200, Content-Length 0, NO content-type,
      #     and Cloudflare caches it (`cf-cache-status: HIT`), so it survives a reload
      # An empty 200 is the tell that the rule EXISTS and is ordered correctly: a missing rule would
      # fall through to the SPA fallback below and answer index.html as text/html instead.
      - type: rewrite
        source: /api/*
        destination: https://api-golden-arrow-385b.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # Response headers for every page and file. These are the ones that cannot break the app; a
    # Content-Security-Policy is deliberately NOT here (see "Content-Security-Policy" in CLAUDE.md for
    # what it would need first). A DASHBOARD-MADE STATIC SITE IGNORES THIS BLOCK - measured 21 Oct
    # 2026, the live site answered only nosniff and Render's own HSTS - so add them as dashboard
    # header rules too. Of these, X-Frame-Options matters most: an ERP that moves money should not be
    # embeddable in someone else's page.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      # no Referer at all: the reset-password page and a customer's document link carry a secret in the address
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # the service worker must always be fetched fresh, or a fixed worker would not reach installed copies
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # A customer's document link carries its secret in the address, so the PAGE must not be indexed.
      # The share API already answers noindex and no-store, but the page the customer opens is
      # /d/<token> here on the static site, and a token pasted anywhere a crawler reaches would
      # otherwise be indexed with the document behind it.
      - path: /d/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
