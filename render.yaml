# Render Blueprint for the Trade ERP frontend (static site).
#
# The Vite app is at the repository root, so the build writes ./dist there and
# rootDir stays empty. Keep staticPublishPath and rootDir consistent: Render
# reported "Publish directory dist does not exist" when the build ran in one
# directory and the publish step looked in another.
#
# Render does not read public/_redirects (that file is Netlify's); the SPA
# fallback has to be the rewrite route below, or deep links such as
# /dashboard 404 even though index.html is published.
#
# The backend is proxied through this frontend (CLAUDE.md "Deployment (Render)", 26 Oct 2026): the API
# rewrite must sit ABOVE the SPA fallback - below it, /* would answer every API call with index.html and
# the app would die on a JSON parse error at the first request. This keeps the backend's own host out of
# every request a browser can see; the backend's own render.yaml must ship SESSION_COOKIE_SAMESITE=lax in
# the SAME deploy, since app and API are one origin now and the backend may no longer see an Origin header
# to check. (A dashboard-made service ignores this file - see the note at the top of the backend's
# render.yaml - so this is the record to apply by hand in the dashboard, not something that deploys itself.)
services:
  - type: web
    runtime: static
    name: zarvia
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time by src/axios/axios.js. Relative on purpose: resolveApiBaseUrl's
      # "host only" branch exists for the OLDER bare-host value this used to be; a relative path keeps the
      # backend's address out of the bundle entirely.
      - key: VITE_API_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://trade-erp-nexus-nodejs.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # Response headers for every page and file of the site. These are the ones that cannot break the app; a Content-Security-Policy is
    # deliberately NOT here (see "Content-Security-Policy" in CLAUDE.md for what it would need before it can be switched on).
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      # no Referer at all: the reset-password page and a customer's document link carry a secret in the address
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # the service worker must always be fetched fresh, or a fixed worker would not reach installed copies
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # A customer's document link carries its secret in the address, so the PAGE must not be indexed. The share API already
      # answers noindex and no-store, but the page the customer actually opens is /d/<token> here on the static site, and a
      # token pasted anywhere a crawler can reach would otherwise be indexed with the document behind it.
      - path: /d/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
