<!doctype html>
<html lang="en" data-brand="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installable app. The manifest carries the name, the icons, the colours and the
         shortcuts; these tags cover what each platform reads instead of, or as well as, it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141519" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Zarvia" />

    <!-- iOS reads none of the manifest's display settings; these are its equivalents. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zarvia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- The product name, shown on the sign-in page and before the app loads. Once signed in,
         Layout.jsx replaces this with the page and the client's own name. -->
    <title>Zarvia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
